# Local gates that must match CI (.github/workflows/ci.yml `test` job).
# The `scaffold` job needs a host checkout and is CI-only.
# Install: pip install pre-commit && pre-commit install
# Run all: pre-commit run --all-files
#
# No package-lock — do not add npm ci / lock-sync hooks.

repos:
  - repo: local
    hooks:
      - id: test
        name: npm test
        entry: bash -c 'npm test'
        language: system
        pass_filenames: false
        always_run: true
