name: test

# Two tiers (`test / context` decides; docs: ARCHITECTURE.md "What CI gates"):
#
#   fast  a feature-branch push to MolCrafts: test / unit on Linux,
#         test / scaffold.
#   full  every push to a fork (proven before its pull request), dev, master
#         and main on MolCrafts, pull requests, tags and dispatches:
#         + test / unit on macOS and Windows.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

permissions:
  contents: read

# One group per file, workflow, event and ref; only a feature ref cancels its
# superseded runs.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master","refs/heads/main"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    name: test / context
    runs-on: ubuntu-latest
    outputs:
      tier: ${{ steps.context.outputs.tier }}
      upstream: ${{ steps.context.outputs.upstream }}
      integration: ${{ steps.context.outputs.integration }}
      skip-pr: ${{ steps.context.outputs.skip-pr }}
      publish: ${{ steps.context.outputs.publish }}
    steps:
      - id: context
        uses: MolCrafts/molcrafts-ci/actions/ci-context@master

  unit:
    name: test / unit (${{ matrix.os }})
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@master
      - run: npm test

  # The shipped artifact is `template/`. Scaffold into a directory with no
  # sibling molvis checkout so deps resolve to the published SDK range.
  scaffold:
    name: test / scaffold
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@master
      - run: node bin/molvis-plugin.mjs create "$RUNNER_TEMP/demo-plugin" --id com.example.demo --name Demo -y
      - name: Generated project installs, typechecks, builds and carries a .gitignore
        working-directory: ${{ runner.temp }}/demo-plugin
        run: |
          npm install
          npm run typecheck
          npm run build
          test -f .gitignore
