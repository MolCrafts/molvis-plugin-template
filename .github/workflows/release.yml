name: release

# A `v*` tag on MolCrafts publishes the CLI (`npx molvis-plugin create`) to
# npm. workflow_dispatch is a dry run anywhere: same gates, `npm pack
# --dry-run`. Trusted publishing (OIDC) needs npm >= 11.5, hence Node 24;
# an empty NPM_TOKEN leaves npm on the id-token.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: release / npm
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.repository_owner == 'MolCrafts' }}
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@master
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm test
      - name: Tag matches package.json
        if: env.PUBLISH == 'true'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p 'require("./package.json").version')"
          [ "$TAG" = "$PKG" ] || { echo "tag $TAG != package.json $PKG" >&2; exit 1; }
      - if: env.PUBLISH == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # A dry run must not depend on the version being unpublished.
      - if: env.PUBLISH != 'true'
        run: npm pack --dry-run
