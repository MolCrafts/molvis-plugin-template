name: ci

# Must stay in lockstep with .pre-commit-config.yaml (local hooks).
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run check:contract
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/prepare-release-assets.mjs
      - name: Upload release-assets
        uses: actions/upload-artifact@v4
        with:
          name: plugin-release-assets
          path: release-assets/
          if-no-files-found: error
